<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Streamlet</title>
<!--
  The Google Cast receiver of Streamlet (app ID E314E16E).
  Streamlet loads its audio as a live stream. While the stream plays, Streamlet sends the
  current track on its own channel. This page shows the track (Google Home app, TV) without
  loading the stream again. Play, pause, next and previous go back to Streamlet.
  The page keeps the delay of the live stream short: it skips ahead when too much audio
  waits in the buffer.
-->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #f2f2f5;
    font-family: system-ui, sans-serif; }
  /* Only devices with a screen show this. */
  main { height: 100%; display: flex; align-items: center; justify-content: center; gap: 6vh; }
  #cover { width: 40vh; height: 40vh; border-radius: 2vh; object-fit: cover; background: #222; }
  #cover:not([src]) { visibility: hidden; }
  h1 { font-size: 5vh; margin: 0 0 1vh; max-width: 50vw; }
  p { font-size: 3.5vh; margin: 0; color: #9999a3; max-width: 50vw; }
</style>
</head>
<body>
<main>
  <img id="cover" alt="">
  <div><h1 id="title">Streamlet</h1><p id="artist"></p></div>
</main>
<audio id="audio"></audio>
<script>
  const NAMESPACE = 'urn:x-cast:com.fgnass.streamlet';
  const messages = cast.framework.messages;
  const context = cast.framework.CastReceiverContext.getInstance();
  const player = context.getPlayerManager();
  const audio = document.getElementById('audio');
  player.setMediaElement(audio);

  function trackMetadata(track) {
    const metadata = new messages.MusicTrackMediaMetadata();
    metadata.title = track.title || 'Streamlet';
    metadata.artist = track.artist || '';
    metadata.albumName = track.album || '';
    if (track.image) metadata.images = [new messages.Image(track.image)];
    return metadata;
  }

  function showTrack(track) {
    document.getElementById('title').textContent = track.title || 'Streamlet';
    document.getElementById('artist').textContent = track.artist || '';
    const cover = document.getElementById('cover');
    if (track.image) cover.src = track.image; else cover.removeAttribute('src');
  }

  // Streamlet sends the current track.
  context.addCustomMessageListener(NAMESPACE, (event) => {
    const data = event.data || {};
    if (data.type !== 'track') return;
    showTrack(data);
    const media = player.getMediaInformation();
    if (!media) return;
    media.metadata = trackMetadata(data);
    player.setMediaInformation(media, true);
  });

  // The audio is a live stream of what Streamlet plays. Controls go to Streamlet,
  // the stream itself keeps going.
  function forward(command) {
    context.sendCustomMessage(NAMESPACE, undefined, { type: 'command', command });
    return null;
  }
  // An error here must not keep the receiver from starting (CAST_INIT_TIMEOUT).
  function intercept(type, handler) {
    try {
      player.setMessageInterceptor(type, handler);
    } catch (error) {
      console.error('Cannot intercept', type, error);
    }
  }
  intercept(messages.MessageType.PAUSE, () => forward('playPause'));
  intercept(messages.MessageType.PLAY, () => forward('playPause'));
  // Next and previous come as a jump in the queue.
  intercept(messages.MessageType.QUEUE_UPDATE, (request) => {
    if (request.jump > 0) return forward('next');
    if (request.jump < 0) return forward('previous');
    return request;
  });

  const commands = messages.Command;
  const supported = commands.PAUSE | commands.QUEUE_NEXT | commands.QUEUE_PREV |
    commands.STREAM_VOLUME | commands.STREAM_MUTE;
  player.addEventListener(cast.framework.events.EventType.PLAYER_LOAD_COMPLETE, () => {
    player.setSupportedMediaCommands(supported, true);
  });

  // The device buffers the live stream before it plays, and each stall makes the delay
  // longer for good. Skip ahead when more audio than MAX_DELAY waits in the buffer.
  const TARGET_DELAY = 0.5;
  const MAX_DELAY = 1.0;
  setInterval(() => {
    if (audio.paused || !audio.buffered.length) return;
    const end = audio.buffered.end(audio.buffered.length - 1);
    const delay = end - audio.currentTime;
    let skipped = false;
    if (delay > MAX_DELAY) {
      audio.currentTime = end - TARGET_DELAY;
      skipped = true;
    }
    try {
      context.sendCustomMessage(NAMESPACE, undefined,
        { type: 'buffer', delay: Math.round(delay * 1000), skipped });
    } catch (error) {
      // No sender is connected.
    }
  }, 1000);

  const options = new cast.framework.CastReceiverOptions();
  options.customNamespaces = { [NAMESPACE]: cast.framework.system.MessageType.JSON };
  options.supportedCommands = supported;
  context.start(options);
</script>
</body>
</html>
